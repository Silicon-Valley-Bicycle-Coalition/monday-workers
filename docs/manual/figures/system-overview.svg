<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>SVBC system overview</title>
  <desc>Upstream services feed Cloudflare Workers that write to Monday.com; other Workers read Monday.com to serve donors, staff and outside services. Every Worker gets its Monday token from the monday-auth broker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#303030"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #303030; stroke-width: 1.2; }
      .ext { fill: #fafafa; stroke: #999999; stroke-width: 1; stroke-dasharray: 4 3; }
      .hub { fill: #ffc700; stroke: #000000; stroke-width: 1.6; }
      .broker { fill: #000000; }
      .h { font-weight: 700; font-size: 13px; }
      .small { font-size: 10.5px; fill: #555555; }
      .col { font-weight: 700; font-size: 11px; fill: #666666; letter-spacing: 0.06em; }
      line, path.c { stroke: #303030; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <text x="20" y="24" class="col">OUTSIDE SERVICES</text>
  <text x="250" y="24" class="col">WORKERS THAT WRITE</text>
  <text x="520" y="24" class="col">SYSTEM OF RECORD</text>
  <text x="730" y="24" class="col">WORKERS THAT READ OR SERVE</text>

  <!-- Upstream services -->
  <rect class="ext" x="20" y="40" width="190" height="44" rx="6"/>
  <text x="32" y="60" class="h">Funraise</text><text x="32" y="75" class="small">online gifts, recurring gifts</text>
  <rect class="ext" x="20" y="94" width="190" height="44" rx="6"/>
  <text x="32" y="114" class="h">Eventbrite</text><text x="32" y="129" class="small">ticket orders, attendees</text>
  <rect class="ext" x="20" y="148" width="190" height="44" rx="6"/>
  <text x="32" y="168" class="h">Benevity reports</text><text x="32" y="183" class="small">uploaded by staff to Monday</text>
  <rect class="ext" x="20" y="202" width="190" height="44" rx="6"/>
  <text x="32" y="222" class="h">Double the Donation</text><text x="32" y="237" class="small">employer matching status</text>
  <rect class="ext" x="20" y="256" width="190" height="44" rx="6"/>
  <text x="32" y="276" class="h">Mailchimp</text><text x="32" y="291" class="small">subscribes, consent, journeys</text>

  <!-- Writers -->
  <rect class="box" x="250" y="40" width="210" height="270" rx="6"/>
  <text x="262" y="62" class="h">Ingest and sync</text>
  <text x="262" y="84">funraise-sync</text>
  <text x="262" y="102">eventbrite-sync</text>
  <text x="262" y="120">benevity-import</text>
  <text x="262" y="138">dtd-sync</text>
  <text x="262" y="156">mailchimp-sync (both ways)</text>
  <text x="262" y="182" class="h">Keep Monday current</text>
  <text x="262" y="204">donation-rollups</text>
  <text x="262" y="222">people-reclassification</text>
  <text x="262" y="240">contact-roles</text>
  <text x="262" y="258">impact-attribution</text>
  <text x="262" y="276">member-portal-writer</text>
  <text x="262" y="294" class="small">webhook → D1 → queue → Monday, or cron</text>

  <line x1="210" y1="62" x2="248" y2="80" marker-end="url(#arrow)"/>
  <line x1="210" y1="116" x2="248" y2="98" marker-end="url(#arrow)"/>
  <line x1="210" y1="170" x2="248" y2="116" marker-end="url(#arrow)"/>
  <line x1="210" y1="224" x2="248" y2="134" marker-end="url(#arrow)"/>
  <line x1="210" y1="278" x2="248" y2="152" marker-end="url(#arrow)"/>

  <!-- Monday hub -->
  <rect class="hub" x="500" y="110" width="190" height="130" rx="10"/>
  <text x="595" y="150" class="h" text-anchor="middle" font-size="16">Monday.com</text>
  <text x="595" y="172" text-anchor="middle">People, Donations,</text>
  <text x="595" y="188" text-anchor="middle">Organizations, Affiliations,</text>
  <text x="595" y="204" text-anchor="middle">Volunteers, Opportunities</text>
  <text x="595" y="226" text-anchor="middle" class="small" fill="#000">staff work here</text>
  <line x1="460" y1="175" x2="498" y2="175" marker-end="url(#arrow)"/>

  <!-- Readers -->
  <rect class="box" x="730" y="40" width="210" height="300" rx="6"/>
  <text x="742" y="62" class="h">For donors</text>
  <text x="742" y="84">member-portal</text>
  <text x="742" y="102">bp-feedback-notify</text>
  <text x="742" y="128" class="h">For staff</text>
  <text x="742" y="150">report-digests (email)</text>
  <text x="742" y="168">member-map</text>
  <text x="742" y="186">nearby-search</text>
  <text x="742" y="212" class="h">Safety net</text>
  <text x="742" y="234">monday-backup (Google Drive)</text>
  <text x="742" y="252">sync-watchdog (Slack)</text>
  <text x="742" y="278" class="h">Not Monday-related</text>
  <text x="742" y="300">svbc-calendars</text>
  <text x="742" y="318" class="small">events widget, .ics feeds</text>
  <line x1="690" y1="175" x2="728" y2="175" marker-end="url(#arrow)"/>

  <!-- Broker -->
  <rect class="broker" x="420" y="380" width="350" height="62" rx="8"/>
  <text x="595" y="406" text-anchor="middle" class="h" fill="#ffc700">monday-auth (token broker)</text>
  <text x="595" y="426" text-anchor="middle" fill="#ffffff" font-size="11">holds the OAuth tokens; Workers get one over a service binding</text>
  <path class="c" d="M355,310 L355,411 L418,411" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <path class="c" d="M835,340 L835,411 L772,411" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <line x1="595" y1="380" x2="595" y2="242" marker-end="url(#arrow)" stroke-dasharray="5 3"/>
  <text x="604" y="320" class="small">OAuth</text>

  <!-- Platform strip -->
  <rect class="ext" x="20" y="470" width="920" height="70" rx="6"/>
  <text x="32" y="492" class="h">Shared platform</text>
  <text x="32" y="512">Cloudflare account: Workers, D1, Queues, KV (write switch), R2, Email sending, Access, WAF</text>
  <text x="32" y="530">GitHub: code, CI, pull requests · Slack: private staff alert channel · Google Drive: backups</text>
</svg>

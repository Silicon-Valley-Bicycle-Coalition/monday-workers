<!-- @dsCard height=288 -->
<!doctype html><html><head><style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
  .cover svg { position: absolute; left: 0; top: 0; }
  .gold { fill: var(--svbc-gold); }
  .ink { fill: var(--svbc-black); }
  .chrome { fill: var(--svbc-chrome); }
  .road { fill: none; stroke: var(--svbc-black); stroke-width: 14; stroke-dasharray: 22 14; }
  [data-theme="dark"] .ink { fill: var(--svbc-chrome); }
  [data-theme="dark"] .chrome { fill: var(--chrome-muted); }
  .name { position: absolute; left: 40px; bottom: 40px; max-width: 440px; font-family: var(--font-heading); }
  .name h1 { margin: 0; font-size: 96px; line-height: .95; font-weight: 500; color: var(--text); letter-spacing: -0.02em; }
  .name p { margin: 12px 0 0; font-family: var(--font-body); font-size: 14px; color: var(--text-muted); }
</style></head><body>
<div class="cover">
  <!--
    blocks: svbc-gold 320×288 slab (space-10×8), svbc-black 160×176 (dark: svbc-chrome), svbc-chrome 160×112 band (dark: chrome-muted)
    arrangement: a wide gold band with the black header and charcoal footer stacked at its right edge, flush and bleeding off three sides, the website's section rhythm turned on its side
    pattern: literal motif, the website's wavy dashed road (stroke 14, dashes 22/14) running across the gold, because it is the one shape bikesiliconvalley.org repeats and it reads as a bike route
    scales: space-10 module, space-4 dash rhythm, radius-pill buttons implied by the round line caps of none (square dashes, as the site draws them)
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="gold" x="480" y="0" width="320" height="288"/>
    <path class="road" d="M470 168 C 560 96, 650 96, 720 150 S 780 220, 810 176"/>
    <rect class="ink" x="800" y="0" width="160" height="176"/>
    <rect class="chrome" x="800" y="176" width="160" height="112"/>
  </svg>
  <div class="name">
    <h1>SVBC<br>Workers</h1>
    <p>Gold, ink and Manrope for the website, member portal, emails and widgets.</p>
  </div>
</div>
</body></html>

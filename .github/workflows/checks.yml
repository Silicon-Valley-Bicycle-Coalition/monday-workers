# Repo-wide consistency checks: the byte-identical copy rosters, the Wrangler config checks and
# the log-safety scan. Ported from the GitLab CI jobs of the same names; all run unconditionally
# (each is seconds), so `checks` is one required status check.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a minor (not `22`) so a new release can't change the build unannounced (#58);
      # patch releases still flow in. 22.18+ is the floor: Workers' .mjs scripts and the copy
      # checks below rely on Node's built-in type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23'

      # The Monday GraphQL transport is copied into each Worker rather than shared as a package, so
      # every Worker stays self-contained (#35). This keeps the copies byte-identical to the
      # canonical one: change monday-backup/src/monday/graphql.ts, then copy it over every path
      # below. A Worker joins by copying the file in and adding its path here.
      - name: monday-graphql-copies
        if: ${{ !cancelled() }}
        run: |
          status=0
          for copy in benevity-import/src/monday/graphql.ts contact-roles/src/monday/graphql.ts donation-rollups/src/monday/graphql.ts dtd-sync/src/monday/graphql.ts eventbrite-sync/src/monday/graphql.ts funraise-sync/src/monday/graphql.ts geo-filter/src/monday/graphql.ts impact-attribution/src/monday/graphql.ts mailchimp-sync/src/monday/graphql.ts member-map/src/monday/graphql.ts member-portal/src/monday/graphql.ts nearby-search/src/monday/graphql.ts people-reclassification/src/monday/graphql.ts quickbooks-sync/src/monday/graphql.ts report-digests/src/monday/graphql.ts; do
            cmp monday-backup/src/monday/graphql.ts "$copy" || { echo "$copy differs from monday-backup/src/monday/graphql.ts"; status=1; }
          done
          # The Workers' .mjs scripts import graphql.ts through Node's strip-only type support, so it
          # must stay loadable without a TypeScript compile step.
          node --input-type=module -e "await import('./monday-backup/src/monday/graphql.ts')" || status=1
          exit $status

      # funraise-sync/src/monday/outage.ts is the canonical per-batch Monday outage breaker for
      # queue consumers (#101); every queue Worker in the list carries a byte-identical copy. Edit
      # funraise-sync's, then copy it to every path listed.
      - name: monday-outage-copies
        if: ${{ !cancelled() }}
        run: |
          status=0
          roster="benevity-import/src/monday/outage.ts donation-rollups/src/monday/outage.ts eventbrite-sync/src/monday/outage.ts mailchimp-sync/src/monday/outage.ts nearby-search/src/monday/outage.ts quickbooks-sync/src/monday/outage.ts"
          for copy in $roster; do
            cmp funraise-sync/src/monday/outage.ts "$copy" || { echo "$copy differs from funraise-sync/src/monday/outage.ts"; status=1; }
          done
          # A new copy that isn't in the roster would drift unchecked.
          for f in */src/monday/outage.ts; do
            case " funraise-sync/src/monday/outage.ts $roster " in
              *" $f "*) ;;
              *) echo "$f is not in the monday-outage-copies roster"; status=1 ;;
            esac
          done
          exit $status

      # geo-filter/src/geometry.ts is the canonical corridor/point-in-polygon logic; nearby-search
      # carries a byte-identical copy (the Worker stays self-contained). Edit geo-filter's, then
      # copy it over.
      - name: geo-geometry-copies
        if: ${{ !cancelled() }}
        run: cmp geo-filter/src/geometry.ts nearby-search/src/geometry.ts

      # The write switch (off/hold/on) lives in one module, member-portal/src/flags.ts. Every
      # in-scope Worker carries a byte-identical copy and the same FLAGS KV namespace ids; edit the
      # canonical file, then copy it over the others. --strict: a Worker without the module fails.
      - name: worker-flags-copies
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-worker-flags.mjs --strict
          # Loaded through Node's strip-only type support, so it must not need a TypeScript compile step.
          node --input-type=module -e "await import('./member-portal/src/flags.ts')"

      # Each Worker reaches Monday through the monday-auth broker's MONDAY_AUTH service binding, and
      # the entrypoint it binds (PortalToken / SyncToken / ReadOnlyToken) sets its access.
      # Production must bind svbc-monday-auth and the sandbox env svbc-monday-auth-sandbox. The
      # expected mapping is EXPECTED in the script; it mirrors the design spec's apps table.
      - name: monday-auth-bindings
        if: ${{ !cancelled() }}
        run: node scripts/check-monday-auth-bindings.mjs

      # Preview URLs default to on, which would expose non-main code with production bindings
      # (#108). Every wrangler*.jsonc with env.sandbox must set "preview_urls": false at the top
      # level and in env.sandbox.
      - name: preview-urls
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-preview-urls.test.mjs
          node scripts/check-preview-urls.mjs

      # Rate-limit bindings that share a namespace_id share per-IP counters even with different
      # limits, so one Worker's traffic can 429 another's (#113). Every ratelimits[].namespace_id
      # must be unique.
      - name: rate-limit-namespaces
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/check-rate-limit-namespaces.test.mjs
          node scripts/check-rate-limit-namespaces.mjs

      # Blocks logging email addresses: Workers Issues forwards the logs around a failure to its
      # automation targets (see root README "Error monitoring: Workers Issues"). A dependency-free
      # scan rather than ESLint: typescript-eslint doesn't support the TypeScript 7 the Workers
      # build with.
      - name: log-safety
        if: ${{ !cancelled() }}
        run: |
          node --test "scripts/*.test.mjs" "scripts/lib/*.test.mjs"
          node scripts/check-log-safety.mjs

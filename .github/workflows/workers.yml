# One test job per changed Worker, then a sandbox deploy of each changed Worker that has a
# `sandbox` Wrangler environment, then a production deploy of each changed Worker that opts in with
# a `production` entry (both on main only). The roster, path rules and deploy order live in
# .github/workers.json; scripts/ci-changed-workers.mjs turns the changed files into the matrices.
# This repo has no root package.json: each Worker is self-contained (see root README/CLAUDE.md).
name: workers

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.diff.outputs.test }}
      deploy: ${{ steps.diff.outputs.deploy }}
      production: ${{ steps.diff.outputs.production }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23'
      # Fails when a top-level directory with a package.json is missing from workers.json, so a
      # new Worker can't silently skip CI. An all-zero or unreachable base tests everything.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # A PR diffs from the merge-base, so commits that landed on the base branch don't count.
          args=(--base "$BASE" --head "$GITHUB_SHA")
          if [ "$EVENT" = pull_request ]; then args+=(--merge-base); fi
          node scripts/ci-changed-workers.mjs "${args[@]}"

  test:
    needs: changes
    if: ${{ needs.changes.outputs.test != '[]' }}
    name: test (${{ matrix.worker.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.test) }}
    defaults:
      run:
        working-directory: ${{ matrix.worker.dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: ${{ matrix.worker.dir }}/package-lock.json
      - run: npm ci
      - run: npm test
      # The Worker's setup-columns script tests (node:test), which import scripts/lib.
      - if: ${{ matrix.worker.extraTest }}
        env:
          EXTRA_TEST: ${{ matrix.worker.extraTest }}
        run: npm run "$EXTRA_TEST"
      # svbc-bike-lanes is plain JavaScript with no typecheck script.
      - run: npm run typecheck --if-present

  # The sandbox deploy path (see each Worker's README "Sandbox environment" section and
  # docs/superpowers/specs/2026-09-18-sandbox-environment-design.md §8). The design first meant
  # this as a fallback for second Workers Builds connections, but no Worker with a sandbox entry
  # has one, so this job is the only thing that keeps sandbox in step with `main`. It runs only on
  # `main`, only for a Worker whose files changed. account_id is baked into each Worker's
  # wrangler.jsonc, so no other secret is needed.
  #
  # A missing CLOUDFLARE_API_TOKEN fails the job (#89). It used to skip with a notice and
  # finish green, so a sandbox that never got the change looked deployed. deploy-sandbox isn't a
  # required check (ci-ok doesn't need it), so a red run here marks main's commit without
  # blocking any pull request.
  #
  # The token is an environment secret scoped to the `sandbox` environment (restrict that
  # environment to `main`), and in Cloudflare to the named sandbox Workers, plus queue and route
  # writes (GL#58; docs/manual/06-ci-and-deploy.md, "The sandbox deploy token").
  # Matrix entries run one at a time in roster order. The concurrency group stops two main runs
  # deploying the same Worker at once, but not in commit order: a slow older run can reach a Worker
  # after a newer one. So each entry, once it holds the group, compares its commit with `main` and
  # skips when a newer commit touches the same Worker, whose own run deploys it
  # (scripts/ci-superseded.mjs). `queue: max` keeps every waiting entry: by default a newly queued
  # entry cancels the waiting one, so an older run could cancel the newest and then skip itself,
  # and nothing would deploy. If the newer commit's tests or deploy fail, the Worker stays as it was
  # until that run is fixed or re-run. member-portal appears twice, portal first, then the writer:
  # Cloudflare Queues allows one consumer Worker per queue, and the sandbox portal consumed
  # member-portal-change-requests-sandbox until the consumer moved to member-portal-writer, so the
  # writer can't be published as its consumer while the portal still is. (wrangler deploy doesn't
  # detach a consumer dropped from the config, so the one-time detach is a manual step: see
  # member-portal/DEPLOY.md, "Sandbox environment".) monday-auth, quickbooks-sync (postponed
  # indefinitely, 2026-10-28), svbc-calendars, svbc-bike-lanes (its own workflow,
  # svbc-bike-lanes.yml, deploys production), salesforce-import and geo-filter have no entry on
  # purpose.
  deploy-sandbox:
    needs: [changes, test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy != '[]' }}
    name: deploy-sandbox (${{ matrix.worker.dir }}${{ matrix.worker.sandbox.config && format(' {0}', matrix.worker.sandbox.config) || '' }})
    runs-on: ubuntu-latest
    environment: sandbox
    concurrency:
      group: sandbox-${{ matrix.worker.dir }}-${{ matrix.worker.sandbox.config || 'main' }}
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      # Keep going past a failure so every changed Worker reports its own result; the default
      # would cancel the rest and leave them looking skipped rather than undeployed.
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.deploy) }}
    # No job-level working-directory: the token check runs before checkout, when the directory
    # doesn't exist yet. The token is exposed to that check (as a boolean) and the deploy step only.
    steps:
      - name: Require the deploy token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          WORKER: ${{ matrix.worker.dir }}
          CONFIG: ${{ matrix.worker.sandbox.config }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the sandbox environment, so $WORKER${CONFIG:+ ($CONFIG)} was NOT deployed to sandbox."
            {
              echo "### $WORKER${CONFIG:+ ($CONFIG)} was not deployed to sandbox"
              echo
              echo "The \`sandbox\` GitHub environment has no \`CLOUDFLARE_API_TOKEN\` secret."
              echo "Add one (permissions: docs/manual/06-ci-and-deploy.md, The sandbox deploy token),"
              echo "then re-run this job, or deploy by hand from \`$WORKER/\`: \`npx wrangler deploy ${CONFIG:+-c $CONFIG }--env sandbox\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: ${{ matrix.worker.dir }}/package-lock.json
      - id: order
        name: Skip if main has a newer change to this Worker
        env:
          WORKER: ${{ matrix.worker.dir }}
          CONFIG: ${{ matrix.worker.sandbox.config }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/ci-superseded.mjs --dir "$WORKER" --head "$GITHUB_SHA" --main origin/main
          if grep -qx 'superseded=true' "$GITHUB_OUTPUT"; then
            newest=$(git rev-parse --short origin/main)
            echo "::notice::$WORKER${CONFIG:+ ($CONFIG)}: not deployed from ${GITHUB_SHA::8}, because main ($newest) has a newer change to it. That change's own run deploys it."
            {
              echo "### $WORKER${CONFIG:+ ($CONFIG)} was not deployed from this commit"
              echo
              echo "\`main\` (\`$newest\`) has a newer change to this Worker. Check that change's own \`deploy-sandbox\` run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      # No install scripts in the job that holds the deploy token: a dependency's postinstall has
      # no business running beside it, and wrangler bundles and deploys without them.
      - if: steps.order.outputs.superseded == 'false'
        working-directory: ${{ matrix.worker.dir }}
        run: npm ci --ignore-scripts
      - if: steps.order.outputs.superseded == 'false'
        working-directory: ${{ matrix.worker.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG: ${{ matrix.worker.sandbox.config }}
        run: npx wrangler deploy ${CONFIG:+-c "$CONFIG"} --env sandbox

  # Production deploys from `main`, after the sandbox (docs/manual/06-ci-and-deploy.md, "What
  # deploys when"). A Worker opts in with a `production` entry in .github/workers.json; those
  # without one (Workers Builds' monday-backup and svbc-calendars, svbc-bike-lanes' own workflow,
  # and Workers not live yet) still deploy by hand. Roster order is deploy order: monday-auth
  # first, then member-portal before its writer, for the same queue-consumer reason as the sandbox.
  #
  # It waits for every sandbox entry: a failed sandbox deploy holds all production deploys in the
  # run (re-run the failed jobs once it's fixed). It deploys code only. Pending D1 migrations stop
  # the entry before the deploy (scripts/ci-pending-migrations.mjs), because applying one stays a
  # human step; apply it by hand, then re-run. The write switch isn't touched.
  #
  # Same token rules as the sandbox, with its own token: an environment secret of `production`
  # (restrict it to `main`; add required reviewers there to make each deploy wait for a click),
  # limited in Cloudflare to the named production Workers plus queue, route and D1 read
  # (docs/manual/06-ci-and-deploy.md, "The production deploy token"). Same skip-when-superseded
  # rule too, so an older run can't put old code back.
  deploy-production:
    needs: [changes, test, deploy-sandbox]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.production != '[]' && needs.test.result == 'success' && (needs.deploy-sandbox.result == 'success' || needs.deploy-sandbox.result == 'skipped') }}
    name: deploy-production (${{ matrix.worker.dir }}${{ matrix.worker.production.config && format(' {0}', matrix.worker.production.config) || '' }})
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-${{ matrix.worker.dir }}-${{ matrix.worker.production.config || 'main' }}
      cancel-in-progress: false
      queue: max
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.production) }}
    steps:
      - name: Require the deploy token
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          WORKER: ${{ matrix.worker.dir }}
          CONFIG: ${{ matrix.worker.production.config }}
        run: |
          if [ "$HAS_TOKEN" != true ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in the production environment, so $WORKER${CONFIG:+ ($CONFIG)} was NOT deployed to production."
            {
              echo "### $WORKER${CONFIG:+ ($CONFIG)} was not deployed to production"
              echo
              echo "The \`production\` GitHub environment has no \`CLOUDFLARE_API_TOKEN\` secret."
              echo "Add one (permissions: docs/manual/06-ci-and-deploy.md, The production deploy token),"
              echo "then re-run this job, or deploy by hand from \`$WORKER/\`: \`npx wrangler deploy${CONFIG:+ -c $CONFIG}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: ${{ matrix.worker.dir }}/package-lock.json
      - id: order
        name: Skip if main has a newer change to this Worker
        env:
          WORKER: ${{ matrix.worker.dir }}
          CONFIG: ${{ matrix.worker.production.config }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node scripts/ci-superseded.mjs --dir "$WORKER" --head "$GITHUB_SHA" --main origin/main
          if grep -qx 'superseded=true' "$GITHUB_OUTPUT"; then
            newest=$(git rev-parse --short origin/main)
            echo "::notice::$WORKER${CONFIG:+ ($CONFIG)}: not deployed from ${GITHUB_SHA::8}, because main ($newest) has a newer change to it. That change's own run deploys it."
            {
              echo "### $WORKER${CONFIG:+ ($CONFIG)} was not deployed to production from this commit"
              echo
              echo "\`main\` (\`$newest\`) has a newer change to this Worker. Check that change's own \`deploy-production\` run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.order.outputs.superseded == 'false'
        working-directory: ${{ matrix.worker.dir }}
        run: npm ci --ignore-scripts
      - if: steps.order.outputs.superseded == 'false'
        name: Refuse while D1 migrations are pending
        working-directory: ${{ matrix.worker.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG: ${{ matrix.worker.production.config || 'wrangler.jsonc' }}
        run: node ../scripts/ci-pending-migrations.mjs --config "$CONFIG"
      - if: steps.order.outputs.superseded == 'false'
        working-directory: ${{ matrix.worker.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONFIG: ${{ matrix.worker.production.config }}
        run: npx wrangler deploy ${CONFIG:+-c "$CONFIG"}

  ci-ok:
    if: ${{ always() }}
    needs: [changes, test]
    runs-on: ubuntu-latest
    steps:
      # A skipped `test` (nothing changed) counts as success; only a failure or cancellation fails.
      - run: |
          echo "changes=${{ needs.changes.result }} test=${{ needs.test.result }}"
          case "${{ needs.changes.result }} ${{ needs.test.result }}" in
            *failure*|*cancelled*) exit 1 ;;
          esac

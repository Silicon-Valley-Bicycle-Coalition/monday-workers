workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - deploy

default:
  image: node:22

# One job per Worker subdirectory — this repo has no root package.json, each
# Worker is self-contained (see root README/CLAUDE.md). A job only runs when
# its own directory changes, so an MR touching one Worker doesn't wait on the
# others.
.worker_job:
  stage: test
  cache:
    key: "$WORKER_DIR"
    paths:
      - "$WORKER_DIR/node_modules/"
  rules:
    - changes:
        - "$WORKER_DIR/**/*"
  script:
    - cd "$WORKER_DIR"
    - npm ci
    - npm test
    - npm run typecheck

# Fallback path for the sandbox deploy connection (see each Worker's README
# "Sandbox environment" section and docs/superpowers/specs/2026-09-18-sandbox-
# environment-design.md §8): the primary path is a second Cloudflare Workers
# Builds connection on the same repo/root directory, deploy command
# `npx wrangler deploy --env sandbox`. If the dashboard refuses two
# connections on one root directory, this job does the same deploy from CI
# instead. It only runs on `main`, only for a Worker whose directory actually
# changed, and only once $CLOUDFLARE_API_TOKEN is set as a CI variable — it
# stays inert until that variable exists, so enabling it never risks a double
# deploy alongside a working dashboard connection. account_id is already
# baked into each Worker's wrangler.jsonc, so no other variable is needed.
.deploy_sandbox_job:
  stage: deploy
  cache:
    key: "$WORKER_DIR"
    paths:
      - "$WORKER_DIR/node_modules/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
      changes:
        - "$WORKER_DIR/**/*"
  script:
    - cd "$WORKER_DIR"
    - npm ci
    - npx wrangler deploy --env sandbox

# The Monday GraphQL transport is copied into each Worker rather than shared as a package, so
# every Worker stays self-contained (#35). This keeps the copies byte-identical to the canonical
# one: change monday-backup/src/monday/graphql.ts, then copy it over every path below. A Worker
# joins by copying the file in and adding its path here.
monday-graphql-copies:
  stage: test
  rules:
    - changes:
        - "*/src/monday/graphql.ts"
        - .gitlab-ci.yml
  script:
    - |
      status=0
      for copy in benevity-import/src/monday/graphql.ts donation-rollups/src/monday/graphql.ts funraise-sync/src/monday/graphql.ts geo-filter/src/monday/graphql.ts mailchimp-sync/src/monday/graphql.ts member-portal/src/monday/graphql.ts quickbooks-sync/src/monday/graphql.ts; do
        cmp monday-backup/src/monday/graphql.ts "$copy" || { echo "$copy differs from monday-backup/src/monday/graphql.ts"; status=1; }
      done
      # The Workers' .mjs scripts import graphql.ts through Node's strip-only type support, so it
      # must stay loadable without a TypeScript compile step.
      node --input-type=module -e "await import('./monday-backup/src/monday/graphql.ts')" || status=1
      exit $status

benevity-import:
  extends: .worker_job
  variables:
    WORKER_DIR: benevity-import

bp-feedback-notify:
  extends: .worker_job
  variables:
    WORKER_DIR: bp-feedback-notify

donation-rollups:
  extends: .worker_job
  variables:
    WORKER_DIR: donation-rollups

member-portal:
  extends: .worker_job
  variables:
    WORKER_DIR: member-portal

funraise-sync:
  extends: .worker_job
  variables:
    WORKER_DIR: funraise-sync

# Not a Worker (a local one-off CLI, like salesforce-import), but it has the same
# npm test/typecheck scripts, so it shares the job template.
geo-filter:
  extends: .worker_job
  variables:
    WORKER_DIR: geo-filter

mailchimp-sync:
  extends: .worker_job
  variables:
    WORKER_DIR: mailchimp-sync

monday-backup:
  extends: .worker_job
  variables:
    WORKER_DIR: monday-backup

quickbooks-sync:
  extends: .worker_job
  variables:
    WORKER_DIR: quickbooks-sync

salesforce-import:
  extends: .worker_job
  variables:
    WORKER_DIR: salesforce-import

svbc-calendars:
  extends: .worker_job
  variables:
    WORKER_DIR: svbc-calendars

# svbc-calendars, salesforce-import and geo-filter have no `sandbox` Wrangler
# environment (see root README/CLAUDE.md) and so have no deploy-sandbox job.

deploy-sandbox:benevity-import:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: benevity-import

deploy-sandbox:bp-feedback-notify:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: bp-feedback-notify

deploy-sandbox:donation-rollups:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: donation-rollups

deploy-sandbox:member-portal:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: member-portal

deploy-sandbox:funraise-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: funraise-sync

deploy-sandbox:mailchimp-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: mailchimp-sync

deploy-sandbox:monday-backup:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: monday-backup

deploy-sandbox:quickbooks-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: quickbooks-sync

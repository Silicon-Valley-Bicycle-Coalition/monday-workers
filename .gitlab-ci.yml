workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

stages:
  - test
  - deploy

# Pinned to a minor (not `node:22`) so a new image can't change the build unannounced (#58);
# patch releases still flow in. 22.18+ is the floor: Workers' .mjs scripts and the copy checks
# below rely on Node's built-in type stripping.
default:
  image: node:22.23

# One job per Worker subdirectory — this repo has no root package.json, each
# Worker is self-contained (see root README/CLAUDE.md). A job only runs when
# its own directory changes, so an MR touching one Worker doesn't wait on the
# others.
.worker_job:
  stage: test
  cache:
    key: "$WORKER_DIR"
    paths:
      - "$WORKER_DIR/node_modules/"
  rules:
    - changes:
        - "$WORKER_DIR/**/*"
  script:
    - cd "$WORKER_DIR"
    - npm ci
    - npm test
    - npm run typecheck

# Fallback path for the sandbox deploy connection (see each Worker's README
# "Sandbox environment" section and docs/superpowers/specs/2026-09-18-sandbox-
# environment-design.md §8): the primary path is a second Cloudflare Workers
# Builds connection on the same repo/root directory, deploy command
# `npx wrangler deploy --env sandbox`. If the dashboard refuses two
# connections on one root directory, this job does the same deploy from CI
# instead. It only runs on `main`, only for a Worker whose directory actually
# changed, and only once $CLOUDFLARE_API_TOKEN is set as a CI variable — it
# stays inert until that variable exists, so enabling it never risks a double
# deploy alongside a working dashboard connection. account_id is already
# baked into each Worker's wrangler.jsonc, so no other variable is needed.
#
# The token must be a Protected + Masked (+ Hidden) CI variable, scoped in
# Cloudflare to Workers deploys on this account only (#58): Protected keeps it
# out of merge-request pipelines, which run unprotected branch code, so an MR
# can't echo it. If you environment-scope it to `sandbox`, check the first main
# pipeline still runs the job: the `rules:` gate below must see the variable. The
# `sandbox` environment lets a maintainer protect deploys in Settings > CI/CD >
# Protected environments; resource_group stops two main pipelines deploying
# the same Worker at once.
.deploy_sandbox_job:
  stage: deploy
  environment:
    name: sandbox
    deployment_tier: staging
  resource_group: "sandbox-$WORKER_DIR"
  cache:
    key: "$WORKER_DIR"
    paths:
      - "$WORKER_DIR/node_modules/"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUDFLARE_API_TOKEN'
      changes:
        - "$WORKER_DIR/**/*"
  script:
    - cd "$WORKER_DIR"
    - npm ci
    - npx wrangler deploy --env sandbox

# The Monday GraphQL transport is copied into each Worker rather than shared as a package, so
# every Worker stays self-contained (#35). This keeps the copies byte-identical to the canonical
# one: change monday-backup/src/monday/graphql.ts, then copy it over every path below. A Worker
# joins by copying the file in and adding its path here.
monday-graphql-copies:
  stage: test
  rules:
    - changes:
        - "*/src/monday/graphql.ts"
        - .gitlab-ci.yml
  script:
    - |
      status=0
      for copy in benevity-import/src/monday/graphql.ts donation-rollups/src/monday/graphql.ts email-log/src/monday/graphql.ts eventbrite-sync/src/monday/graphql.ts funraise-sync/src/monday/graphql.ts geo-filter/src/monday/graphql.ts mailchimp-sync/src/monday/graphql.ts member-portal/src/monday/graphql.ts nearby-search/src/monday/graphql.ts people-reclassification/src/monday/graphql.ts quickbooks-sync/src/monday/graphql.ts report-digests/src/monday/graphql.ts; do
        cmp monday-backup/src/monday/graphql.ts "$copy" || { echo "$copy differs from monday-backup/src/monday/graphql.ts"; status=1; }
      done
      # The Workers' .mjs scripts import graphql.ts through Node's strip-only type support, so it
      # must stay loadable without a TypeScript compile step.
      node --input-type=module -e "await import('./monday-backup/src/monday/graphql.ts')" || status=1
      exit $status

# geo-filter/src/geometry.ts is the canonical corridor/point-in-polygon logic; nearby-search carries
# a byte-identical copy (the Worker stays self-contained). Edit geo-filter's, then copy it over.
geo-geometry-copies:
  stage: test
  rules:
    - changes: ["*/src/geometry.ts", .gitlab-ci.yml]
  script:
    - cmp geo-filter/src/geometry.ts nearby-search/src/geometry.ts

# The write switch (off/hold/on) lives in one module, member-portal/src/flags.ts. Every in-scope
# Worker carries a byte-identical copy and the same FLAGS KV namespace ids; edit the canonical file,
# then copy it over the others. --strict: a Worker without the module fails the job.
worker-flags-copies:
  stage: test
  rules:
    - changes:
        - "*/src/flags.ts"
        - "*/wrangler.jsonc"
        - "*/wrangler.writer.jsonc"
        - scripts/check-worker-flags.mjs
        - .gitlab-ci.yml
  script:
    - node scripts/check-worker-flags.mjs --strict
    # Loaded through Node's strip-only type support, so it must not need a TypeScript compile step.
    - node --input-type=module -e "await import('./member-portal/src/flags.ts')"

# Each Worker reaches Monday through the monday-auth broker's MONDAY_AUTH service binding, and the
# entrypoint it binds (PortalToken / SyncToken / ReadOnlyToken) sets its access. Production must
# bind svbc-monday-auth and the sandbox env svbc-monday-auth-sandbox. The expected mapping is
# EXPECTED in the script; it mirrors the design spec's apps table.
monday-auth-bindings:
  stage: test
  rules:
    - changes:
        - monday-auth/**/*
        - "*/wrangler*.jsonc"
        - scripts/check-monday-auth-bindings.mjs
        - scripts/check-monday-auth-bindings.test.mjs
        - scripts/check-worker-flags.mjs
        - .gitlab-ci.yml
  script:
    - node scripts/check-monday-auth-bindings.mjs

# Blocks logging email addresses: Workers Issues forwards the logs around a failure to its
# automation targets (see root README "Error monitoring: Workers Issues"). A dependency-free scan
# rather than ESLint — typescript-eslint doesn't support the TypeScript 7 the Workers build with.
log-safety:
  stage: test
  rules:
    - changes:
        - "*/src/**/*"
        - scripts/**/*
        - .gitlab-ci.yml
  script:
    - node --test "scripts/*.test.mjs"
    - node scripts/check-log-safety.mjs


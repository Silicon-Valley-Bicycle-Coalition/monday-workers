# Not a Worker (a local one-off CLI, like salesforce-import), but it has the same
# npm test/typecheck scripts, so it shares the job template.
geo-filter:
  extends: .worker_job
  variables:
    WORKER_DIR: geo-filter

mailchimp-sync:
  extends: .worker_job
  variables:
    WORKER_DIR: mailchimp-sync

# The OAuth broker. Its rules add scripts/lib/**, which src/probe.ts imports
# (../../scripts/lib/token-scope.mjs). No deploy-sandbox job on purpose: it is deployed by hand,
# after its D1 migrations are applied (see monday-auth/README.md, "Deploying").
monday-auth:
  extends: .worker_job
  variables:
    WORKER_DIR: monday-auth
  rules:
    - changes:
        - "$WORKER_DIR/**/*"
        - scripts/lib/**/*

monday-backup:
  extends: .worker_job
  variables:
    WORKER_DIR: monday-backup

nearby-search:
  extends: .worker_job
  variables:
    WORKER_DIR: nearby-search

people-reclassification:
  extends: .worker_job
  variables:
    WORKER_DIR: people-reclassification

quickbooks-sync:
  extends: .worker_job
  variables:

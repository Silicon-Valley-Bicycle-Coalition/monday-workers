report-digests:
  extends: .worker_job
  variables:
    WORKER_DIR: report-digests

salesforce-import:
  extends: .worker_job
  variables:
    WORKER_DIR: salesforce-import

svbc-calendars:
  extends: .worker_job
  variables:
    WORKER_DIR: svbc-calendars

# svbc-calendars, salesforce-import and geo-filter have no `sandbox` Wrangler
# environment (see root README/CLAUDE.md) and so have no deploy-sandbox job.
# quickbooks-sync is postponed indefinitely (decided 2026-10-28): its tests still run above, but
# it has no deploy-sandbox job, so a merge doesn't redeploy it.

deploy-sandbox:benevity-import:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: benevity-import

deploy-sandbox:bp-feedback-notify:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: bp-feedback-notify

deploy-sandbox:donation-rollups:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: donation-rollups

deploy-sandbox:email-log:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: email-log

deploy-sandbox:eventbrite-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: eventbrite-sync

# Portal first, then the writer. Cloudflare Queues allows one consumer Worker per queue, and the
# sandbox portal consumed member-portal-change-requests-sandbox until the consumer moved to
# member-portal-writer, so the writer can't be published as its consumer while the portal still
# is. Change requests simply wait in the queue between the two deploys. (wrangler deploy doesn't
# detach a consumer dropped from the config, so the one-time detach is a manual step: see
# member-portal/DEPLOY.md, "Sandbox environment". Production never had a portal consumer.)
deploy-sandbox:member-portal:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: member-portal

# The change-requests queue consumer, split out of member-portal (wrangler.writer.jsonc). Same
# directory and cache as the portal; resource_group is distinct so the two jobs don't share a lock.
# optional: when the portal deploy job doesn't exist in a pipeline, the writer still deploys. Its
# needs then still include the member-portal test job, so a red test never deploys it (when the
# portal job exists it waits on the whole test stage, and so does the writer through it).
deploy-sandbox:member-portal-writer:
  extends: .deploy_sandbox_job
  resource_group: "sandbox-member-portal-writer"
  needs:
    - job: member-portal
      optional: true
    - job: deploy-sandbox:member-portal
      optional: true
  variables:
    WORKER_DIR: member-portal
  script:
    - cd "$WORKER_DIR"
    - npm ci
    - npx wrangler deploy -c wrangler.writer.jsonc --env sandbox

deploy-sandbox:funraise-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: funraise-sync

deploy-sandbox:mailchimp-sync:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: mailchimp-sync

deploy-sandbox:monday-backup:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: monday-backup

deploy-sandbox:nearby-search:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: nearby-search

deploy-sandbox:people-reclassification:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: people-reclassification

deploy-sandbox:report-digests:
  extends: .deploy_sandbox_job
  variables:
    WORKER_DIR: report-digests
